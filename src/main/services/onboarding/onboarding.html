<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Widget Desktop</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag;
            user-select: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .step {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step-number {
            background: #ffffff;
            color: #764ba2;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            -webkit-app-region: no-drag;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: #ffffff;
            color: #764ba2;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            -webkit-app-region: no-drag;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        label {
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Widget Desktop</h1>
        <p>Let's get you set up with everything you need to make the most of your desktop widgets.</p>

        <div class="steps">
            <div class="step">
                <div class="step-number">1</div>
                <div>Create and customize widgets with our intuitive interface</div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div>Drag and position widgets anywhere on your desktop</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div>Manage all your widgets from the convenient settings panel</div>
            </div>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="analytics" checked>
            <label for="analytics">Help improve Widget Desktop by sending anonymous usage data</label>
        </div>

        <div class="buttons">
            <button class="secondary" onclick="skipOnboarding()">Skip</button>
            <button class="primary" onclick="completeOnboarding()">Get Started</button>
        </div>
    </div>

    <script>
        // Get initial analytics state
        window.onboarding.getAnalyticsEnabled().then(enabled => {
            document.getElementById('analytics').checked = enabled;
        });

        // Handle analytics checkbox changes
        document.getElementById('analytics').addEventListener('change', (e) => {
            window.onboarding.setAnalyticsEnabled(e.target.checked);
        });

        function completeOnboarding() {
            window.onboarding.complete();
        }

        function skipOnboarding() {
            window.onboarding.skip();
        }
    </script>
</body>
</html>
